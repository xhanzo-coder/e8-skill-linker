name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m py_compile skills/e8-skill-linker/scripts/skill_manager.py tests/test_skill_manager.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Exercise CLI
        run: python skills/e8-skill-linker/scripts/skill_manager.py --version

  validate-skill:
    name: Validate Agent Skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate skill metadata and structure
        run: python scripts/validate_skill.py skills/e8-skill-linker
